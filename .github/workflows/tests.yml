name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: uji dan build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
